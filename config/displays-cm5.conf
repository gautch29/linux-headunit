# Physical HDMI output remains 1280x720@60 in Weston.
# This signed Ultra layout currently requires a 1920x720 video canvas.
# The final GPU blit fits the full canvas on the physical output with bars.
# No code overrides these advertised dimensions; see CONFIGURATION.md.
# The advertised logical Ultra canvas is 1920x720. In the live test, matching
# physical-size fields to this wide aspect fixed overlapping iPhone-rendered
# icons. Advertising the actual 16:9 touchscreen estimate (155x87 mm) broke it.
# The real touchscreen is approximately 155x87 mm; 155x58 mm describes the
# virtual wide panel that is uniformly fitted into the physical output.
# Cluster millimetres describe the virtual bench panel, not a physical device.
main.width=1920
main.height=720
main.fps=60
main.width_mm=155
main.height_mm=58
main.panel=Center_Display
main.wayland=headunit-0
cluster.width=1920
cluster.height=720
cluster.fps=60
cluster.width_mm=200
cluster.height_mm=75
cluster.panel=Cluster_Display
cluster.wayland=headunit-center-bench
