# One compositor connection, two physical HDMI outputs. Each Ultra window
# requests fullscreen on its named wl_output through xdg-shell.
# The signed asset's logical canvases remain 1920x720; the GPU fits them
# without stretching into the physical display modes.
main.width=1920
main.height=720
main.fps=60
main.width_mm=155
main.height_mm=58
main.panel=Center_Display
main.wayland=wayland-0
main.output=HDMI-A-1
cluster.width=1920
cluster.height=720
cluster.fps=60
cluster.width_mm=200
cluster.height_mm=75
cluster.panel=Cluster_Display
cluster.wayland=wayland-0
cluster.output=HDMI-A-2
