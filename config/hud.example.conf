# Local HUD output. This does not add a third CarPlay panel or video stream.
# Replace DSI-1 with the actual compositor connector name for the fitted HUD.
output=DSI-1
wayland=wayland-0
main_output=HDMI-A-1
cluster_output=HDMI-A-2
width=960
height=360
fps=20
# Fresh provider country takes precedence. Use FR, GB, US, CA, etc. as fallback.
country=auto
# Optics determine the reflection axis. Verify using the calibration preview.
reflect_horizontal=true
reflect_vertical=false
quarter_turns=0
scale=1
offset_x=0
offset_y=0
# Optional measured projective correction: supply all eight normalized values.
# top_left_x=0
# top_left_y=0
# top_right_x=1
# top_right_y=0
# bottom_right_x=1
# bottom_right_y=1
# bottom_left_x=0
# bottom_left_y=1
