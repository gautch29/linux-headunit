# Labwc output profiles for the CM5 bench. Reapply on HDMI hot-plug.
profile dual {
    output HDMI-A-1 enable mode 1280x720@60Hz position 0,0
    output HDMI-A-2 enable mode 1920x1080@60Hz position 1280,0
}

profile main-only {
    output HDMI-A-1 enable mode 1280x720@60Hz position 0,0
}
