# EXPERIMENTAL: current signed main layout crops on the iPhone at this video size.
# Not the working CM5 profile. See docs/CONFIGURATION.md.
# HDMI output must also be configured to 1280x720@60 in Weston.
# Main millimetres: estimate from nominal 7-inch diagonal and 16:9 aspect.
# Replace with measured visible width/height. Ultra requires both values.
# Cluster millimetres describe the virtual bench panel, not a physical device.
main.width=1280
main.height=720
main.fps=60
main.width_mm=155
main.height_mm=87
# This signed pack authors its local scene at 1920x720. Map it on the GPU
# into main.width x main.height; video and touch still use actual output pixels.
main.asset_width=1920
main.asset_height=720
main.panel=Center_Display
main.wayland=headunit-0
cluster.width=1920
cluster.height=720
cluster.fps=60
cluster.width_mm=200
cluster.height_mm=75
cluster.panel=Cluster_Display
cluster.wayland=headunit-center-bench
